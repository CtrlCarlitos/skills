name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  vendor-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: skill-creator equals upstream pin + patches
        run: bash scripts/sync-vendor.sh skill-creator --check
      - name: show-me equals upstream pin + patches
        run: bash scripts/sync-vendor.sh show-me --check
      - name: mp-code-review equals upstream pin + patches
        run: bash scripts/sync-vendor.sh mp-code-review --check
      - name: every SKILL.md has name and description
        run: |
          set -e
          for f in skills/*/SKILL.md; do
            grep -q '^name: ' "$f" && grep -q '^description: ' "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo PASS
      - name: install skill-creator dependencies
        run: pip install -r skills/skill-creator/requirements.txt
      - name: install repo-policy dependencies
        run: pip install -r skills/repo-policy/requirements.txt
      - name: install deliver dependencies
        run: pip install -r skills/deliver/requirements.txt
      - name: skill-creator regression tests
        working-directory: skills/skill-creator
        run: python3 -m unittest discover -s tests -v
      - name: show-me regression tests
        working-directory: skills/show-me
        run: python3 -m unittest discover -s tests -v
      - name: repo-policy regression tests
        working-directory: skills/repo-policy
        run: python3 -m unittest discover -s tests -v
      - name: release-notes regression tests
        working-directory: skills/release-notes
        run: python3 -m unittest discover -s tests -v
      - name: update-docs regression tests
        working-directory: skills/update-docs
        run: python3 -m unittest discover -s tests -v
      - name: mp-code-review regression tests
        working-directory: skills/mp-code-review
        run: python3 -m unittest discover -s tests -v
      - name: deliver regression tests
        working-directory: skills/deliver
        run: python3 -m unittest discover -s tests -v
      - name: git-editor-config regression tests
        working-directory: skills/git-editor-config
        run: python3 -m unittest discover -s tests -v
      - name: sync-vendor.sh diff-portability test
        run: bash scripts/tests/test_sync_vendor.sh

  skill-creator-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Runs before any test/build step: unittest's __pycache__ output would
      # otherwise show up as "new files" against the pristine rebuild below,
      # a false drift report unrelated to the mode-bit flakiness this step
      # is actually checking for. See the ubuntu-latest job's step order.
      #
      # Known-flaky, permanently non-blocking: confirmed (not just suspected)
      # that this fails on Windows -- git-for-Windows/NTFS doesn't track Unix
      # executable bits the way Linux does, so --check's mode comparison
      # reports a mismatch here even when the content is identical. Kept for
      # visibility only; see vendor/skill-creator/DISPOSITION.md.
      - name: skill-creator equals upstream pin + patches (known-flaky mode check)
        shell: bash
        continue-on-error: true
        run: bash scripts/sync-vendor.sh skill-creator --check
      - name: show-me equals upstream pin + patches (known-flaky mode check)
        shell: bash
        continue-on-error: true
        run: bash scripts/sync-vendor.sh show-me --check
      - name: mp-code-review equals upstream pin + patches
        shell: bash
        run: bash scripts/sync-vendor.sh mp-code-review --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: install skill-creator dependencies
        run: pip install -r skills/skill-creator/requirements.txt
      - name: install repo-policy dependencies
        run: pip install -r skills/repo-policy/requirements.txt
      - name: install deliver dependencies
        run: pip install -r skills/deliver/requirements.txt
      - name: skill-creator regression tests
        working-directory: skills/skill-creator
        run: python -m unittest discover -s tests -v
      - name: show-me regression tests
        working-directory: skills/show-me
        run: python -m unittest discover -s tests -v
      - name: repo-policy regression tests
        working-directory: skills/repo-policy
        run: python -m unittest discover -s tests -v
      - name: release-notes regression tests
        working-directory: skills/release-notes
        run: python -m unittest discover -s tests -v
      - name: update-docs regression tests
        working-directory: skills/update-docs
        run: python -m unittest discover -s tests -v
      - name: mp-code-review regression tests
        working-directory: skills/mp-code-review
        run: python -m unittest discover -s tests -v
      - name: deliver regression tests
        working-directory: skills/deliver
        run: python -m unittest discover -s tests -v
      - name: git-editor-config regression tests
        working-directory: skills/git-editor-config
        run: python -m unittest discover -s tests -v
      - name: sync-vendor.sh diff-portability test
        shell: bash
        run: bash scripts/tests/test_sync_vendor.sh

  skill-creator-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Runs before any test/build step, same reason as the Windows job
      # above: unittest's __pycache__ output would otherwise show up as
      # "new files" against the pristine rebuild, a false drift report.
      #
      # Not continue-on-error here, unlike the Windows job: macOS's filesystem
      # (unlike NTFS) tracks Unix executable bits the same way Linux does, and
      # this is also the first real verification that the macOS diff-tool fix
      # from #9 (git diff --no-index --ignore-cr-at-eol, replacing the
      # GNU-only `diff -r --strip-trailing-cr`) actually works on real macOS.
      - name: skill-creator equals upstream pin + patches
        run: bash scripts/sync-vendor.sh skill-creator --check
      - name: show-me equals upstream pin + patches
        run: bash scripts/sync-vendor.sh show-me --check
      - name: mp-code-review equals upstream pin + patches
        run: bash scripts/sync-vendor.sh mp-code-review --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: install skill-creator dependencies
        run: pip install -r skills/skill-creator/requirements.txt
      - name: install repo-policy dependencies
        run: pip install -r skills/repo-policy/requirements.txt
      - name: install deliver dependencies
        run: pip install -r skills/deliver/requirements.txt
      - name: skill-creator regression tests
        working-directory: skills/skill-creator
        run: python3 -m unittest discover -s tests -v
      - name: show-me regression tests
        working-directory: skills/show-me
        run: python3 -m unittest discover -s tests -v
      - name: repo-policy regression tests
        working-directory: skills/repo-policy
        run: python3 -m unittest discover -s tests -v
      - name: release-notes regression tests
        working-directory: skills/release-notes
        run: python3 -m unittest discover -s tests -v
      - name: update-docs regression tests
        working-directory: skills/update-docs
        run: python3 -m unittest discover -s tests -v
      - name: mp-code-review regression tests
        working-directory: skills/mp-code-review
        run: python3 -m unittest discover -s tests -v
      - name: deliver regression tests
        working-directory: skills/deliver
        run: python3 -m unittest discover -s tests -v
      - name: git-editor-config regression tests
        working-directory: skills/git-editor-config
        run: python3 -m unittest discover -s tests -v
      - name: sync-vendor.sh diff-portability test
        run: bash scripts/tests/test_sync_vendor.sh
