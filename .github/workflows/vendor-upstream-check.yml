name: Vendor Upstream Check

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compare vendored subtrees with upstream
        run: python3 scripts/check_vendor_updates.py
        env:
          GH_TOKEN: ${{ github.token }}
